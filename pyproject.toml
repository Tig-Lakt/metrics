[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-observability-service"
version = "0.1.0"
description = "Сервис для демонстрации мониторинга нагрузки (FastAPI + Prometheus + Grafana + Loki)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.115.6",
    "sqlmodel==0.0.22",
    "asyncpg==0.30.0",
    "pydantic-settings==2.7.1",
    "prometheus-fastapi-instrumentator==7.0.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "aiosqlite==0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"